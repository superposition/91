name: Rust migration checks

on:
  push:
    paths: ['Cargo.toml', 'Cargo.lock', 'rust/**', 'firmware/**', 'host/**', 'web/**', 'tests/**', 'assets/fonts/**', 'tools/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'rust/**', 'firmware/**', 'host/**', 'web/**', 'tests/**', 'assets/fonts/**', 'tools/**', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoring:
    name: Rust authoring and full-song compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: rustup toolchain install 1.94.1 --profile minimal
      - run: python3 -m pip install mido==1.3.3 numpy==1.24.4 Pillow==12.3.0 packaging==26.3
      - name: Reconstruct and verify the complete frozen comparison source
        run: python3 tools/frozen_source.py build/r01-source
      - name: Authoring, fake-device transactions, CLI and six complete songs
        run: bash tests/rust_authoring.sh build/r01-source
      - name: Rescue and debugger policy over virtual USB endpoints
        run: bash tests/rust_rescue.sh build/r01-source
      - name: Loader block compression and package wrappers
        run: python3 tests/rust_build_policy.py build/r01-source
      - name: Font, pattern and sine generator compatibility
        run: bash tests/rust_assets.sh build/r01-source
      - name: DX voice banks, permissive authoring import and logo generation
        run: bash tests/rust_dx_logo.sh build/r01-source
      - name: Native bootstrap under inherited Cargo features and compiler flags
        run: python3 tests/host_bootstrap_test.py build/r01-source
      - name: Vendor image, disassembly and HAL source guards
        run: python3 tests/rust_build_guards.py build/r01-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authoring-proof
          path: |
            build/authoring-proof/
            build/authoring-device/
            build/authoring-acceptance/
            build/authoring-cli/
            build/authoring-preview/

  browser_pointer_model:
    name: Retained browser and device pointers under Miri
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python3 -m pip install Pillow==12.3.0
      - run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup toolchain install nightly-2026-08-28 --profile minimal --component miri --component rust-src
      - run: sh tests/rust_web_audio_miri.sh
      - run: sh tests/rust_web_platform_miri.sh
      - run: sh tests/rust_hal_miri.sh
      - run: sh tests/rust_ui_miri.sh
      - run: sh tests/rust_sim_store_miri.sh
  native_simulator:
    name: Native Rust simulator and scenario compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: rustup toolchain install 1.94.1 --profile minimal --target wasm32-unknown-unknown
      - run: python3 -m pip install --quiet Pillow
      - name: Full scenario corpus and fresh-process repeatability
        env:
          RUSTUP_TOOLCHAIN: '1.94.1'
          PARITY_JOBS: '4'
        run: sh tests/rust_simulator.sh
      - name: Existing native entry point and piece roundtrip
        env:
          RUSTUP_TOOLCHAIN: '1.94.1'
          AMB_LEGACY_BOOT: '1'
        run: |
          sh host/build_host.sh
          python3 tools/build_codecs.py
          node tests/web_piece_test.js build/host/amb_host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-simulator-proof
          path: |
            build/simulator/*.json
            build/simulator/*.log
            build/simulator/source-verification.log
  web_metadata:
    name: Web metadata and build safety
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned Rust codec compiler
        run: rustup toolchain install 1.94.1 --profile minimal --target wasm32-unknown-unknown
      - run: python3 tools/build_codecs.py
      - run: python3 tests/package_codecs_test.py
      - run: node tests/host/codecs_wasm_test.mjs
      - run: python3 tools/make_params.py --check
      - run: python3 tests/web_build_test.py
      - run: node tests/web_metadata_test.mjs
      - run: node tests/web_backup_test.js
      - run: node tests/web_piece_test.js
      - run: node tests/web_syx_test.js
      - run: node tests/web_ota_test.mjs
      - run: node tests/web_idle_test.mjs

  portable:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Pinned Rust and WASM target
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - run: cargo +1.94.1 fmt --all --check
      - run: cargo +1.94.1 test --workspace --features fm1-jam-bridge/web --locked
      - run: cargo +1.94.1 clippy --workspace --all-targets --features fm1-jam-bridge/web --locked -- -D warnings
      - run: cargo +1.94.1 check -p fm1-types -p fm1-formats -p fm1-engine -p fm1-rt --target wasm32-unknown-unknown --locked
      - run: cargo +1.94.1 test -p fm1-rt --features pi32v2 --locked
      - run: cargo +1.94.1 check -p fm1-jam-bridge --no-default-features --features pi32v2 --target wasm32-unknown-unknown --locked
      - run: cargo +1.94.1 build --release --locked -p fm1-jam-bridge --no-default-features --features web --target wasm32-unknown-unknown
      - run: python tools/frozen_source.py build/r01-source
      - run: python tests/rust_tooling.py build/r01-source

  emulator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned Rust and WASM target
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup override set 1.94.1
      - run: python3 -m pip install --quiet Pillow
      - name: Pinned WASM clang
        run: |
          curl -fsSL https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz -o /tmp/zig.tar.xz
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  /tmp/zig.tar.xz" | sha256sum -c -
          tar -xf /tmp/zig.tar.xz -C "$HOME"
          mv "$HOME/zig-x86_64-linux-0.17.1" "$HOME/zig"
          mkdir -p "$HOME/shim"
          cat > "$HOME/shim/clang" <<'EOS'
          #!/usr/bin/env bash
          args=()
          for a in "$@"; do
              case "$a" in
                  --target=wasm32|-target=wasm32) ;;
                  *) args+=("$a") ;;
              esac
          done
          exec "$HOME/zig/zig" cc -target wasm32-freestanding "${args[@]}"
          EOS
          chmod +x "$HOME/shim/clang"
          echo "$HOME/shim" >> "$GITHUB_PATH"
      - name: Full-instrument C/Rust differential playback
        run: sh tests/rust_emulator_parity.sh
      - name: Browser bindings and lifecycle
        run: node tests/host/emu_browser_test.mjs build/emu/amb.wasm
      - name: Cached audio views, irregular quanta and fixed memory
        run: node tests/host/emu_audio_views_test.mjs build/emu-parity/reference.wasm build/emu-parity/rust.wasm
      - name: Allocation-free WASI timestamp encoding
        run: node tests/host/emu_clock_test.mjs build/emu/amb.wasm
      - name: Browser audio ring, output and background compatibility
        run: sh tests/rust_web_audio.sh
      - name: Browser platform metadata, stores and framebuffer compatibility
        run: sh tests/rust_web_platform.sh
      - name: Native clock, melodic/drum scheduling, mutation and event trace parity
        run: sh tests/rust_melodic_parity.sh
      - name: Isolated analog voice state and PCM parity
        run: sh tests/rust_voices_parity.sh
      - name: Isolated drone and acid state and PCM parity
        run: sh tests/rust_tonal_parity.sh
      - name: Isolated pad worker and bus state and PCM parity
        run: sh tests/rust_pad_parity.sh
      - name: Voice recipes, controls, note lifecycle and MIDI order
        run: sh tests/rust_voice_setup.sh
      - name: Voice block coefficients and raw capture compatibility
        run: sh tests/rust_voice_config.sh
      - name: Voice parameter application, note conversion and reinitialization
        run: sh tests/rust_voice_parameters.sh
      - name: DJ/snippet voice state, lifecycle, RNG and PCM
        run: sh tests/rust_dj_parity.sh
      - name: Foreground DJ audio with worker placements
        run: sh tests/rust_dj_workers.sh
      - name: FM6 tables and operator components
        run: sh tests/rust_fm6_tables.sh
      - name: FM6 allocator, FIFO and voice lifecycle
        run: sh tests/rust_fm6_parity.sh
      - name: FM6 keys and bass worker placements
        run: sh tests/rust_fm6_workers.sh
      - name: Compact factory tables and packed musical codecs
        run: sh tests/rust_factory_tables.sh
      - name: Shared native, browser and package codec compatibility
        run: sh tests/rust_shared_formats.sh
      - name: Actual browser and persistent object codec consumers
        run: sh tests/rust_browser_codecs.sh
      - name: Device wire and Jam transfer compatibility
        run: sh tests/rust_device_wire.sh
      - name: A/B flash transactions and interrupted writes
        run: sh tests/rust_persistence.sh
      - name: Project, slot and extension lifecycle
        run: sh tests/rust_project.sh
      - name: Settings, session and autosave lifecycle
        run: sh tests/rust_persistence_ui.sh
      - name: Persistent application scenarios and exact inherited failures
        run: sh tests/rust_project_scenarios.sh
      - name: Native effects, master, output and state parity
        run: sh tests/rust_effects_parity.sh
      - name: Effects worker placement and ordered completion
        run: sh tests/rust_effects_workers.sh
      - name: Effects settings, block traversal, fades and reset boundaries
        run: sh tests/rust_effects_completion.sh
      - name: Worker handoff, confirmed loss and quarantine
        run: sh tests/rust_worker_handoff.sh
      - name: Physical backend completion and stopped-owner ordering
        run: sh tests/rust_mcu_hal.sh
      - name: Nested saved IRQ-state binding
        run: |
          cc -O2 -Ifirmware/hal tests/host/hal_irq_state_test.c -o build/hal-irq-state
          build/hal-irq-state
      - name: Complete MCU queue publication across render interruption
        run: sh tests/rust_command_irq.sh
      - name: Legacy harmonic policy, register search and progression callbacks
        run: sh tests/rust_harmony_parity.sh
      - name: Exact graphics and retained display DMA source
        run: sh tests/rust_app_graphics.sh
      - name: KickRunner gameplay, drawing and retained display source
        run: sh tests/rust_runner_policy.sh
      - name: Shared UI layout and in-place state initialization
        run: sh tests/rust_ui_state.sh
      - name: Foreground UI frame and callback order
        run: sh tests/rust_ui_frame.sh
      - name: Encoder acceleration and bounded input
        run: sh tests/rust_ui_controls.sh
      - name: Button actions, reentrant callbacks and checked page helpers
        run: |
          sh tests/rust_ui_buttons.sh
          sh tests/rust_ui_classify.sh
      - name: TRS MIDI parser and retained UART DMA
        run: sh tests/rust_usb_trs.sh
      - name: HAL registers, startup, IRQ and DMA fault contracts
        run: sh tests/rust_hal_parity.sh
      - name: HAL audio output and retained DMA source
        run: sh tests/rust_hal_audio_parity.sh
      - name: Whole-worker flash admission and saved data preservation
        run: sh tests/rust_hal_store_admission.sh
      - name: UI pending reads, writes and selection retries
        run: sh tests/rust_ui_busy.sh
      - name: Retained foreground requests and guarded updater transitions
        run: sh tests/rust_storage_dispatch.sh
      - name: Complete frozen source for queued USB regression
        run: python3 tools/frozen_source.py build/r01-source
      - name: Retained SysEx extent under unrelated incoming starts
        run: sh tests/rust_usb_busy_dispatch.sh build/r01-source
      - name: Full application held controls, keys and encoder routing
        run: sh tests/rust_ui_input.sh build/r01-source
      - name: Scene, tempo, view and Jam-off label compatibility
        run: |
          sh tests/rust_ui_performance.sh build/r01-source
          sh tests/rust_jam_labels.sh build/r01-source
      - name: USB descriptors, collectors and interrupt-safe MIDI queues
        run: |
          sh tests/rust_usb_control.sh build/r01-source
          sh tests/rust_usb_transport.sh build/r01-source
          sh tests/rust_usb_transport.sh build/r01-source edge
          sh tests/rust_usb_queues.sh build/r01-source
      - name: Device TX traversal and reset-boundary publication
        run: |
          sh tests/rust_usb_tx.sh build/r01-source
          sh tests/rust_usb_reset.sh build/r01-source
      - name: Songbook snapshot and staging handoffs
        run: sh tests/rust_handoff.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-parity
          path: |
            build/emu-parity/
            build/handoff/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transport-parity
          path: |
            build/transport-parity/*.json
            build/transport-parity/source-verification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-parity
          path: |
            build/voices/*.json
            build/voices/source-verification.log
            build/tonal/*.json
            build/tonal/source-verification.log
            build/pad/*.json
            build/pad/source-verification.log
            build/voice-setup/*.json
            build/voice-setup/source-verification.log
            build/voice-config/*.json
            build/voice-config/source-verification.log
            build/voice-parameters/*.json
            build/voice-parameters/source-verification.log
            build/dj/*.json
            build/dj/source-verification.log
            build/dj-workers/results.txt
            build/dj-workers/source-verification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-effects-parity
          path: |
            build/factory/*.json
            build/factory/r01-verification.log
            build/effects-parity/*.json
            build/effects-parity/results.jsonl
            build/effects-parity/source-verification.log
            build/effects-workers/results.txt
            build/effects-completion/*.json
            build/effects-completion/results.jsonl
            build/effects-completion/source-verification.log
            build/worker-handoff/*.json
            build/worker-handoff/results.jsonl
            build/worker-handoff/source-verification.log
            build/persistence/*.log
            build/persistence/*verification.log
            build/persistence/scenarios/*/*.rc
            build/persistence/scenarios/*/*.normalized
            build/harmony-parity/*.json
            build/harmony-parity/results.jsonl
            build/harmony-parity/source-verification.log
            build/app-graphics/*.jsonl
            build/web-audio/*.jsonl
            build/runner-policy/*.jsonl
